<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos Online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <span class="eyebrow">PLAYER WEB</span>
      <h1>Twitch flutuante</h1>
      <p class="intro">Informe um canal e abra o player em uma janela destacada do navegador.</p>
      <form id="channel-form">
        <div class="field-grid">
          <div>
            <label for="platform">Plataforma</label>
            <select id="platform" name="platform">
              <option value="twitch">Twitch</option>
              <option value="kick">Kick</option>
            </select>
          </div>
          <div>
            <label for="channel">Nome do canal</label>
            <input id="channel" name="channel" list="channel-suggestions" placeholder="ex.: twitchdev" autocomplete="off" required>
            <datalist id="channel-suggestions"></datalist>
            <div id="suggestions" class="suggestions" aria-label="Sugestões de canais"></div>
          </div>
        </div>
        <div class="controls">
          <button type="submit">Abrir player</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
      <p class="hint">As sugestões usam uma lista local e os canais pesquisados recentemente.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
