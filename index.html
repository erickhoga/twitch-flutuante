<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch flutuante</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <span class="eyebrow">PLAYER WEB</span>
      <h1>Twitch flutuante</h1>
      <p class="intro">Informe um canal e abra o player em uma janela destacada do navegador.</p>
      <form id="channel-form">
        <label for="channel">Canal da Twitch</label>
        <div class="controls">
          <input id="channel" name="channel" placeholder="ex.: twitchdev" autocomplete="off" required>
          <button type="submit">Abrir player</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
      <p class="hint">A Twitch exige que a página esteja publicada em HTTPS. No GitHub Pages, isso já é atendido.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
